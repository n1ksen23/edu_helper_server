server {
    listen 80;
    server_name eduhelper.cosmomine.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name eduhelper.cosmomine.ru;
    ssl_certificate /etc/letsencrypt/live/eduhelper.cosmomine.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduhelper.cosmomine.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css;
    location / {
        root /var/www/eduhelper;
        add_header Cache-Control 'no-cache' always;
        try_files $uri $uri/ /index.html;
    }
    location = /downloads/android.json {
        alias /var/www/eduhelper-downloads/android.json;
        default_type application/json;
        add_header Cache-Control 'no-store' always;
    }
    location /downloads/ {
        alias /var/www/eduhelper-downloads/;
    }
    location = /admin { return 410; }
    location ^~ /admin/ { return 410; }
    location ~ ^/(api/|docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
