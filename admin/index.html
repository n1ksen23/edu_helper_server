<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduHelper · Администратор</title><link rel="stylesheet" href="style.css"><main><h1>EduHelper</h1><p>Управление группами</p><form id="login"><label>Мастер-пароль<input id="master" type="password" autocomplete="current-password" required></label><button>Войти</button></form><p id="status" role="status"></p><section id="panel" hidden><button id="logout">Выйти</button><h2>Заявки на добавление группы</h2><div id="requests"></div><button id="moreRequests" hidden>Загрузить ещё</button><h2>Группы</h2><div id="groups"></div><h2 id="title">Новая группа</h2><form id="editor"><label>Название<input id="name" required maxlength="100"></label><label>Новый пароль (от 12 символов)<input id="password" type="password" minlength="12" autocomplete="new-password"></label><label><input id="published" type="checkbox"> Опубликована</label><label><input id="active" type="checkbox" checked> Активна</label><label>Часовой пояс<input id="timezone" value="Europe/Moscow" required></label><label>Опорный понедельник<input id="anchor" type="date" value="2026-10-19" required></label><label>Тип опорной недели<select id="week"><option value="lower">Нижняя</option><option value="upper">Верхняя</option></select></label><button>Сохранить</button><button type="button" id="reset">Новая группа</button><button type="button" id="revoke">Отозвать сессии</button></form><p>Редактирование расписания и ДЗ любой группы доступно в Android-приложении: включите «Вход администратора» в настройках.</p></section></main><script src="app.js"></script></html>
