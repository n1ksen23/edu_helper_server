name: Verify API
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eduhelper
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eduhelper_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U eduhelper" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://eduhelper:test@localhost:5432/eduhelper_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx aiosqlite
      - run: python -m pytest -q
